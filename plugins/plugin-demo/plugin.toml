# 烛夜示例插件 —— 五类 capability 各配一个最小可运行样例。
#
# 安装:zhuye plugin install plugins/plugin-demo
# 启用:zhuye plugin enable demo@inline
#      (等价于把 "demo@inline" 写进 ~/.zhuye/config.toml 的
#       [plugins].enabled_plugins,运行中改动支持热重载)
name = "demo"
version = "0.1.0"
description = "烛夜插件机制演示:slash 命令 / 子代理 / 技能 / hook / MCP server"
keywords = ["example", "demo"]

# ── 五类 capability 声明 ──────────────────────────────────────────────
# commands:*.md slash 命令(用户输入 `/demo:<名字> <参数>` 时展开为正文)
commands = "./commands"
# agents:子代理定义(frontmatter 解析为 SubAgentSpec + call_<role> 工具)
agents = "./agents"
# skills:SKILL.md 技能(模型用 load_skill 按需激活)
skills = "./skills"
# hooks:Claude Code 风格 hooks.json,包装为外部进程 ShellHook
hooks = "./hooks/hooks.json"
# mcp_servers:MCP server 声明(工具以 mcp__plugin:demo:<名>__<工具> 注入)
mcp_servers = "./.mcp.json"

# ── WASM 组件工具(v1.x C3;产物经 scripts/build_plugin_demo_wasm.sh 构建)──
# 组件按 wit/plugin.wit 的 zhuye-tool 世界实现,宿主进程内实例化。
# 样例产物 bin/*.wasm 随插件入库(可直接安装体验);改源码后用
# scripts/build_plugin_demo_wasm.sh 重建。产物缺失时该工具注册仅
# warn,不影响其余能力。
[[wasm_tools]]
path = "bin/zhuye-demo-tool.wasm"
name = "demo_echo"
