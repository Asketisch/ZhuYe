# notebook 门控插件 —— Jupyter .ipynb cell 级编辑工具。
#
# 形态:门控型(goal-queue 先例)—— 工具本体(notebook_edit)留在
# 引擎 crate(zhuye-tools),注册与否由本插件的启用状态决定。**默认
# 开启**(BUNDLED_PLUGIN_DEFAULTS 表),升级用户行为不变:工具名
# notebook_edit、与 read_before_edit hook 的 WRITE_TOOLS 白名单联动、
# 默认可用性均保持原样。
#
# 关闭(二选一,粒度不同):
# - 插件级(推荐):zhuye plugin disable notebook@inline
#   → 工具不进注册表(tools 面消失、tool_search 搜不到)。
# - 工具名级:[active] disallowed_tools = ["notebook_edit"]
#   → 工具仍注册,仅 LLM 不可见(可见性过滤层)。
#
# 安装(为了 plugin enable / 命令挂载;门控判定不依赖安装):
#   zhuye plugin install plugins/notebook --scope user
#   zhuye plugin enable notebook@inline
name = "notebook"
version = "0.1.0"
description = "notebook_edit 工具(Jupyter .ipynb cell 级编辑):数据科学场景,默认开启;可整体禁用或仅对 LLM 隐藏"
keywords = ["notebook", "jupyter", "ipynb", "gated"]
commands = "./commands"
