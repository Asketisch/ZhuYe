# Browser 插件 —— 受控浏览器(shim attach 本机浏览器 + 代理 agent-browser MCP)。
#
# 使用前必须先构建二进制(装插件 = 授权任意代码执行;本插件可启动本地
# 浏览器实例并驱动网页交互,请仅在信任的环境安装):
#   ./scripts/build_browser_plugin.sh            # shim 必建;submodule 已初始化则捆绑上游二进制
#   zhuye plugin install plugins/browser --scope user
#   zhuye plugin enable browser@inline
#
# 被控端为本机 Chrome/Edge/Chromium(可用 ZHUYE_BROWSER_EXECUTABLE 覆盖),
# 以隔离 profile($ZHUYE_HOME/browser-profile)运行,不触碰用户主 profile;
# 上游 agent-browser 经 AGENT_BROWSER_CDP attach 该实例,连接失败只报错、
# 不回退自启/下载浏览器(「不下载」原则的根基,已对照上游源码确认)。
# 页面工具面来自上游(`agent_browser_*`);上游缺失时 shim 降级应答
# (isError + 可操作安装提示),不 panic。
name = "browser"
version = "0.2.0"
description = "Browser:导航 / 可及性快照 / 点击 / 填写 / 按键 / 滚动 / 截图 / 多标签(本机浏览器 attach + agent-browser 工具面)"
keywords = ["browser", "cdp", "automation"]
mcp_servers = "./.mcp.json"
