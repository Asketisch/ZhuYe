# cli_e2e.example.toml —— CLI 端到端演练套件的配置模板。
#
# 使用:复制为同目录 `cli_e2e.toml`(该文件名已 gitignore,真实端点 /
# 密钥不会入库),按注释填写后运行:
#
#   # 真模型模式(需要下面的端点可达)
#   ZHUYE_LIVE=1 bash tests/live/cli_e2e.sh
#
#   # 自检模式(mock provider,离线、不发网络请求):不需要填端点
#   ZHUYE_E2E_MOCK=1 bash tests/live/cli_e2e.sh
#
# 所有顶层字段可用环境变量按字段名覆盖(前缀 ZHUYE_E2E_,见 cli_e2e.sh
# 头部说明),环境变量优先于本文件。
#
# 场景清单与各自参数见文件末尾的 [scenarios.*] 段 —— 每个场景都能
# 单独覆盖参数(如换窗口大小、换任务文案);不写就用脚本内置默认值。

# ── 端点与模型 ──────────────────────────────────────────────────────────────
# 演练用的真实模型服务。base_url 到版本段为止(引擎会拼 /chat/completions)。
# 示例为占位值 —— 本地推理服务填它的局域网地址,云服务填真实地址与 key。
[endpoint]
base_url = "http://127.0.0.1:8000/v1"
api_key = "anything"
model = "your-model-name"
# 线格式:openai / anthropic / ollama(与 ~/.zhuye/config.toml 的
# model_group.endpoint 同口径)。vLLM / 大多数本地推理服务填 openai。
endpoint = "openai"
# 模型上下文窗口(token)。可选:省略时引擎按 静态表 → models.dev →
# 128K 兜底 自动推导;压缩触发阈值 = 窗口 × 0.85(压缩比亦可在生成
# 的引擎配置 [compact].trigger_ratio 调整)。建议与真实服务端
# max_model_len 对齐。
# context_window = 1000000

# ── 运行参数 ────────────────────────────────────────────────────────────────
[run]
# 思考强度:low / medium / high / xhigh(超出模型支持档位会被引擎钳制)。
effort = "xhigh"
# 单阶段(出 plan / 开发 / 收尾)超时秒数。真实模型 + 高强度思考需要
# 余量:实测一轮 plan ≈ 3-10 分钟。
phase_timeout = 1200

# ── 任务(下发给 agent 的真实工作)─────────────────────────────────────────
# prompt 在 plan 模式下作为首个任务下发;continue_prompt 在批准 plan、
# 开发回合结束后作为收尾指令下发(要求完成 git 提交 —— 这是沙箱 .git
# 归属快照的端到端回归点:agent 在沙箱内 init / add / commit 必须
# 全部成功)。换任务时同步调整下方 expect_* 三个验收期望。
[task]
prompt = """
阅读本工作区的 README.md,为「烽火 Fanfire」制作一个单页介绍站:创建 index.html(内联 CSS 的原生单文件,不引任何外部依赖),内容需包含产品名、定位一句话、三个特性、快速开始命令。完成后把工作区初始化为 git 仓库(git init -b main)并把 README.md 与 index.html 一起提交(提交信息用「feat: 烽火介绍单页」;git 身份用 -c user.name/-c user.email 参数传入,不要依赖全局配置)。不要做 README 之外的事。
"""
continue_prompt = """
如果 git init / commit 尚未完成请继续完成它(index.html 与 README.md 都要在提交里);已全部完成则直接给出最终答复。
"""
# 验收期望(断言与任务配对;换任务必须同步改):
# expect_artifact  —— 开发完成后必须存在于工作区的产物(相对路径);
# expect_commit_subject —— 提交信息的主题行(脚本 grep git log --format=%s)。
expect_artifact = "index.html"
expect_commit_subject = "feat: 烽火介绍单页"

# ── 场景参数 ────────────────────────────────────────────────────────────────
# 每个 [scenarios.<场景名>] 段对应一个端到端场景;**不写即用内置默认值**。
# 场景名与 cli_e2e_scenarios/ 下的模块一一对应(注册表见
# cli_e2e_scenarios/__init__.py)。
#
# 场景分组:plan(规划门控)/ goal(目标模式)/ compact(上下文压缩)/
# cache(prompt cache)/ interact(交互)/ session(会话)/ ext(扩展)。

# ── plan 组 ────────────────────────────────────────────────────────────────
[scenarios.plan_dev_commit]
# plan → 批准 → 开发 → git init + commit(沙箱 .git 归属快照回归点)。
# max_continue_turns —— 开发未收尾时的续推轮数上限(用上面的
# [task].continue_prompt 续推,直到产物与提交都到位)。
max_continue_turns = 2

[scenarios.plan_revise]
# plan → 打回(revise)→ 按反馈修订 → 批准 → 开发。
# prompt —— 首轮下发给 agent 的任务文案。
prompt = "为产品创建 a.txt(内容 hello)。先给出计划,不要直接动手。"

[scenarios.plan_readonly]
# plan 模式只读门控:写工具与高风险 bash 被拦,工作区不落盘。
prompt = "请直接创建文件 leak.txt(内容 hello),不需要规划,现在就创建。如果无法创建,就改为提交一份创建它的计划。"

# ── compact 组(全部只跑自检模式:依赖给 mock 模型配小窗口的确定性构造)──
[scenarios.compact_auto]
# window —— 给 mock 模型的上下文窗口(token);压缩阈值 = window × 0.85。
# rounds —— 脚本化模型回复里连续读文件的次数(累积上下文直到越阈)。
# file_chars —— 夹具文件字符数(≈ file_chars/4.16 token)。
window = 4500
rounds = 30
file_chars = 420

[scenarios.compact_manual]
# Op::Compact 强制压缩:受理即回 Noop 回执,下一回合无视阈值执行压缩;
# 且**绕过 rapid-refill 守卫**(守卫已上膛时强制压缩照常执行)。
# user_chars —— 首条用户消息字符数(固定保留、压不动):与 file_chars
# 一起把上下文顶到触发阈值之上,让守卫上膛。
window = 8000
rounds = 120
user_chars = 20800
file_chars = 420

[scenarios.compact_summarize]
# 单条超大历史 → 走 LLM 摘要压缩(前两级压不动时的最后一级)。
window = 4500
big_chars = 17000

[scenarios.compact_refill_guard]
# rapid-refill 熔断回归(sess_77cd626f 事故形态):压缩后又立刻填满。
# user_chars 越大,上下文越贴近窗口上限,越可能命中「接近窗口上限」
# 的那个收口分支。
window = 4500
file_chars = 420
user_chars = 9800
rounds = 40

[scenarios.compact_window_full]
# 上下文占满单条不可压消息 → compact_unavailable_window_full 收口。
window = 4500
huge_chars = 20000

# ── goal 组 ────────────────────────────────────────────────────────────────
[scenarios.goal_met]
# 目标模式:LLM 自校验判 met + 校验命令通过 → complete。
# goal —— 目标陈述;verify_command —— AND 条件校验命令(退出码 0 才算达成)。
goal = "创建 out.txt"
verify_command = "test -f out.txt"

[scenarios.goal_unmet]
# 目标模式:首轮判 unmet → 续作文本入队 → 下一回合合并注入后达成。
goal = "创建 out.txt"

[scenarios.goal_budget]
# 目标模式:token 预算耗尽 → budget_limited 终态。
# token_budget —— 目标模式的累计 token 预算(mock 下一次模型调用即超)。
goal = "做一个长期任务"
token_budget = 1

[scenarios.goal_plugin]
# goal-queue 插件:goal / queue 两个工具注册且可调用(模型经 tool_search
# 发现它们 —— 插件工具不进 always_on 广播集)。

# ── cache 组 ───────────────────────────────────────────────────────────────
[scenarios.cache_warming]
# 空闲期 prompt cache 保温(引擎配置由脚本生成:enabled+force,TTL 压到
# 4 秒以便在测试里等到重放)。无需参数。

[scenarios.cache_hit]
# 真模型前缀缓存命中:连跑几轮,断言第 2 轮起 cached_tokens > 0。
# 依赖真实 provider 上报缓存分段(mock 恒为 0)—— 仅真模型模式运行。
rounds = 3

[scenarios.cache_write]
# 缓存写入分段(cache_write_tokens)。仅 Anthropic 线缆会报,其他线格式
# 自动跳过该断言。

# ── interact 组 ────────────────────────────────────────────────────────────
[scenarios.interrupt]
# 回合中途中断:长 sleep 被取消,turn 以 user_interrupt 收口。
# sleep_secs —— 被中断的 bash 睡眠时长。
sleep_secs = 30

[scenarios.steer]
# 回合中途转向:steer 消息在下一个安全点注入模型上下文。
# priority —— now(用户中途说话) / attachment(参考资料,<system-reminder> 包裹)。
# steer_text —— 投喂的文本。
priority = "now"
steer_text = "改用方案 B:不要写文件,只汇报。"

[scenarios.ask_user]
# 向用户提问:ask_user_question(结构化选项)/ ask_user(自由文本)。
# answer_text —— 对自由文本提问的回答。
answer_text = "用方案 A"

[scenarios.approval]
# 工具审批:非只读 bash 触发 approval_request,批准后真的执行。

[scenarios.approval_deny]
# 工具审批:拒绝后命令不执行、工具回执为错误。

# ── session 组 ─────────────────────────────────────────────────────────────
[scenarios.resume]
# 会话续作:--resume 回放历史,模型看得到上一轮输入。

[scenarios.rewind]
# 会话回退:Op::Rewind 截断历史,下一轮看不到被回退的输入。

[scenarios.max_iterations]
# 迭代上限:max_iterations 触顶后回合以 max_iterations 收尾。
max_iterations = 3

[scenarios.token_budget]
# 会话级 token 预算:耗尽后回合以 token_budget_exceeded 收尾。
session_total_tokens = 1

# ── ext 组 ─────────────────────────────────────────────────────────────────
[scenarios.subagent]
# 子代理:派生 call_explorer,回报 subagent_progress 与状态快照。

[scenarios.background]
# 后台任务:bash run_in_background,完成结果注入下一轮上下文。

[scenarios.remote_tool]
# 客户端远程工具:RegisterTools → tool_execution_request → 客户端回执。

[scenarios.admin_ops]
# 管理面 Op:子代理状态 / prompt guard 统计 / 提示词列表 / 扩展重扫 /
# 权限模式切换与循环,各自回一条事件。
