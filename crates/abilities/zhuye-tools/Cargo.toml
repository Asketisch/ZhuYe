[package]
name = "zhuye-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ZhuYe: Tool trait, builtin tools, ToolExecutionQueue"

[dependencies]
zhuye-protocol = { workspace = true }
zhuye-fs       = { workspace = true }
zhuye-prompt   = { workspace = true }
zhuye-hooks    = { workspace = true }
# S5a:`ApprovalGate` 注入 `PermissionResolver` 短路 Allow/Deny(详见
# `approval.rs::ask_tool` 入口)。`zhuye-permissions` 不反向依赖
# `zhuye-tools`,单向注入即可。
zhuye-permissions = { workspace = true }
# v1.2 P0-1:`OsSandbox`(macOS Seatbelt / Linux Landlock)给 `BashTool`
# 提供真实 OS 沙箱。`zhuye-sandbox` 不反向依赖 `zhuye-tools`,无环。
zhuye-sandbox    = { workspace = true }
# WP8:checkpoint 原语下沉至 zhuye-git(git 能力族统一家);zhuye-git 只
# 依赖 serde/tokio,不反向依赖 tools,无环。
zhuye-git         = { workspace = true }
# WP8:CheckpointTool / RewindTool 从 zhuye-exec 移入本 crate(它们本就是
# 工具);rollout 只依赖 protocol/sanitize/fs,无环。
zhuye-rollout     = { workspace = true }
async-trait        = { workspace = true }
futures            = { workspace = true }
htmd               = { workspace = true }
ignore             = { workspace = true }
once_cell          = { workspace = true }
parking_lot        = { workspace = true }
regex              = { workspace = true }
# v1.9 C1/C2:循环失控守卫的调用/输出指纹(SHA-256)。
sha2               = { workspace = true }
zhuye-bm25       = { workspace = true }
reqwest            = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
similar            = { workspace = true }
thiserror          = { workspace = true }
tokio              = { workspace = true }
tokio-util         = { workspace = true }
tracing            = { workspace = true }
url                = { workspace = true }
uuid               = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }

[dev-dependencies]
# Phase 7 `read_before_edit_e2e.rs` 用 `filetime::set_file_mtime` 模拟
# 外部 mtime 漂移(无需 `std::thread::sleep` 不可靠等待)。
filetime = { workspace = true }
tempfile = "3"
proptest = { workspace = true }

[lints]
workspace = true
