[package]
name = "zhuye-browser"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ZhuYe: 浏览器控制插件 shim(attach 本机浏览器 + 代理 agent-browser MCP;plugins/browser 的能力本体)"

# 修复原因:自 v0.2 起 CDP 页面能力整体交给上游 agent-browser(源码以
# third_party/agent-browser submodule 钉住),Rust 侧只保留「确保本机浏览器
# (attach 或隔离 profile 启动)+ spawn 上游 MCP + stdio 代理」—— 之前
# 手写 CDP 客户端(~1.3k 行,仅覆盖 10 个 CDP method、无真机 E2E)对抗真实
# 网页的维护成本过高,且上游同为 Rust 直连 CDP、`@eN` 快照语义与原 F39 同构。
# 因此本 crate 不再有任何网络栈依赖(ws/tokio/base64 全部移除),纯同步 std。
[dependencies]
serde_json   = { workspace = true }
thiserror    = { workspace = true }
zhuye-config = { workspace = true }

[[bin]]
name = "zhuye-browser-server"
path = "src/bin/zhuye-browser-server.rs"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
