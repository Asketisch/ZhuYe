[package]
name = "zhuye-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ZhuYe: 常驻 shell 会话池(启动 / 增量读 / stdin / kill;plugins/shell 的能力本体)"

[dependencies]
serde              = { workspace = true }
serde_json         = { workspace = true }
thiserror          = { workspace = true }
tracing            = { workspace = true }
parking_lot        = { workspace = true }
zhuye-config       = { workspace = true }
tokio              = { workspace = true, features = ["process", "io-util", "macros", "rt", "time", "sync"] }
uuid               = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# 会话 kill 的整树终止用 Job Object(与 Unix 进程组对等);版本与
# zhuye-lsp / zhuye-mcp 的 windows-sys 对齐。
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
