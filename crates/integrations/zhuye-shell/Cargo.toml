[package]
name = "zhuye-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ZhuYe: 常驻 shell 会话池(启动 / 增量读 / stdin / kill;plugins/shell 的能力本体)"

[dependencies]
serde              = { workspace = true }
serde_json         = { workspace = true }
thiserror          = { workspace = true }
tracing            = { workspace = true }
parking_lot        = { workspace = true }
zhuye-config       = { workspace = true }
tokio              = { workspace = true, features = ["process", "io-util", "macros", "rt", "time", "sync"] }
uuid               = { workspace = true }

[dev-dependencies]
tempfile = "3"
