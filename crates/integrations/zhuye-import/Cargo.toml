[package]
name = "zhuye-import"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ZhuYe: 外部 Harness 会话历史导入(Claude Code / Codex / ZCode → 烛夜 rollout)"

[dependencies]
zhuye-protocol = { workspace = true }
zhuye-rollout  = { workspace = true }
# v1.10 功能1:配置导入要读写烛夜 config.toml(ReflectConfig schema + TOML)。
zhuye-config   = { workspace = true }
toml           = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
chrono         = { workspace = true }
uuid           = { workspace = true }
thiserror      = { workspace = true }
tracing        = { workspace = true }
base64         = "0.22"
tempfile       = "3"
# ZCode 会话存储在 SQLite(~/.zcode/cli/db/db.sqlite);bundled 特性自带
# sqlite3 C 源码,避免依赖系统 libsqlite3。仅本 crate 使用,不进 SDK facade。
rusqlite = { workspace = true, features = ["backup"] }
# 仅二进制入口用(clap derive 解析直跑模式参数)。
clap = { workspace = true }
