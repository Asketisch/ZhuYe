version: 2
# 只保留 github-actions 的版本更新。
#
# cargo 依赖改为手工维护(`cargo update -p <crate>` 放进既有维护窗口):
# 本仓库有 MSRV 1.89 约束 + 45 crate workspace,自动 bump 必然编译不过,
# 只会持续产出长期红灯的 PR(实测 33 个 PR 合并 0 个)。
#
# 注意:cargo 的 **安全更新** 不受此影响 —— 安全更新由仓库设置里的
# `dependabot_security_updates` 独立开关控制,不在本文件的 `updates:` 数组内,
# 出现 RustSec advisory 时仍会自动提 PR。
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
  # TS SDK 的 npm 依赖:只收补丁与次版本。major 升级需要人工改代码
  # (实测 vitest 1→5 / vite→8 要求 @types/node >=22.12.0,与项目当前的
  # ^20.11.0 冲突,CI 必红),一律交给维护窗口手工处理。
  - package-ecosystem: "npm_and_yarn"
    directory: "/sdks/typescript"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
