name: CI

on:
  schedule:
    - cron: '23 18 * * *'
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # nightly quality(schedule 触发)失败后需要手动重跑验证 —— 不加这个,
  # 修完只能等第二天凌晨的 cron 才知道结果。
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # PyO3 在编译期需要解释器。CI runner 镜像的默认 Python 会随镜像升级漂移
  # (曾从 3.12 漂到 3.14,导致 pyo3-ffi 构建脚本硬失败),故所有需要
  # 编译 pyo3 的 job 显式 setup-python 并用 PYO3_PYTHON 锁定解释器。
  PYTHON_VERSION: "3.14"
  PYO3_PYTHON: python3

jobs:
  runner-tests:
    name: test runner registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pytest
      # 质量门禁策略判定(P0)与差分验证器变异自测(P1)纳入调度器自检。
      - run: python -m unittest -v tests.test_runner tests.test_bench tests.test_diagnostics tests.test_eval_quality tests.eval.test_policy tests.verification.test_differential
      - run: python tests/update_coverage_count.py --check


  # F12(gap-report §6):框架 CI 此前全 ubuntu —— Windows/macOS 上的原生
  # 行为(safe_write NT 层、Job Object 整树终止、文件锁 code 5、Seatbelt
  # 路径)只靠桌面端 CI 间接覆盖。补关键 crate 的跨平台 test job(离线,
  # ZHUYE_MODEL=mock;不含 pyo3 绑定层 —— 其构建依赖随桌面/发布链覆盖)。
  cross-platform-tests:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      ZHUYE_MODEL: mock
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Windows 上文件锁(code 5)对并发 cargo 进程敏感 —— 单线程测试进程。
      - run: cargo test -p zhuye-tools -p zhuye-config -p zhuye-core -p zhuye-rollout --lib

  check:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: cargo check --workspace --all-targets

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # --no-fail-fast:一个 test binary 失败不阻断其余 binaries(一次
      # 看到全部失败面,失败诊断不再打地鼠)。
      - run: cargo test --workspace --all-targets --no-fail-fast

  # SDK 测试用本地 Node "mock serve" 驱动协议,不依赖 zhuye 二进制
  # 与网络(离线;真二进制的端到端覆盖在 Rust 集成测试 serve_stdio.rs)。
  sdk-ts:
    name: sdk typescript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
        working-directory: sdks/typescript
      - run: npm run typecheck
        working-directory: sdks/typescript
      - run: npm test
        working-directory: sdks/typescript

  sdk-python:
    name: sdk python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pytest
        working-directory: sdks/python
      - run: pytest -ra
        working-directory: sdks/python
        env:
          PYTHONPATH: .

  sdk-docs:
    name: sdk protocol documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: ./scripts/release_sdk.sh check_docs

  # 作废说法文档门禁:规则演进后旧表述残留在现状文档里即失败
  # (历史/归档目录豁免;登记表见脚本头注释与 STALE_PHRASES)。
  docs-stale-phrases:
    name: docs stale phrases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 scripts/check_stale_doc_phrases.py

  # 功能覆盖门禁:能力覆盖层(Python 打真二进制,原始 wire)+ Rust CLI 参数面
  # + 双 SDK 和原生 Python 绑定。cargo test / clippy / fmt / doc 由上面的 job 覆盖,
  # 这里用 `functional` 模式跳过(ZHUYE_SKIP_WORKSPACE=1)。
  functional-suite:
    name: functional test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 显式装 toolchain:runner 镜像里的 rustup **没有默认 toolchain**
      # (既没有 `rustup default`,仓库外的临时目录也读不到 rust-toolchain.toml),
      # 任何在仓库外执行的 cargo 都会报
      # "rustup could not choose a version of cargo to run"。
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: install jq (tests/rust/*.sh 依赖)
        run: sudo apt-get update && sudo apt-get install -y jq
      - run: pip install pytest maturin
      - name: build zhuye binary (release)
        run: cargo build --release -p zhuye-cli
      - name: build zhuye-import (会话导入用例需要)
        run: cargo build --release -p zhuye-import
      # 这些产物缺失时对应能力用例会跳过，必须在门禁中显式构建。
      # computer-use / browser 不启用 real feature，以覆盖无图形/无浏览器环境降级。
      - name: build plugin servers (插件能力用例需要)
        run: cargo build --release -p zhuye-kms -p zhuye-computer-use -p zhuye-browser -p zhuye-shell -p zhuye-git-tools --bins
      - name: build mock MCP server (审批用例需要)
        run: cargo build -p zhuye-mcp
      - run: npm ci
        working-directory: sdks/typescript
      - run: ./tests/run_all.sh functional
        env:
          ZHUYE_TEST_ARTIFACTS: ${{ github.workspace }}/target/test-failures
      - name: Upload functional failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: functional-failure-evidence
          path: target/test-failures/
          if-no-files-found: ignore
          retention-days: 7

  nightly-quality:
    name: nightly quality
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
      - name: Build release runtime
        run: cargo build --release -p zhuye-cli --locked
      - name: Run sustained protocol fuzz
        run: ZHUYE_FUZZ_CASES=100000 cargo test -p zhuye-protocol --test event_mutation_fuzz --locked
      - name: Run storage fault matrix
        run: cargo test -p zhuye-rollout --test resume_loads_history record_fails_on --locked
      - name: Run lock contention
        run: cargo test -p zhuye-task --test file_store_lock_contention --locked
      - name: Run performance baseline
        run: BENCH_RUNS=10 ./scripts/bench.sh
      - name: Run env lock soak
        run: ZHUYE_ENV_STRESS_RUNS=30 ./tests/rust/env_lock_stress.sh
      # 核心语义差分(P1):同一提交的 release/debug 两个二进制对 5 个事故
      # 回放场景重放,零分歧预期 —— 验证差分链路本身在 CI 环境可跑且全绿。
      - name: Build debug runtime (差分候选)
        run: cargo build -p zhuye-cli
      - name: Run semantic differential (事故回放)
        env:
          ZHUYE_DIFF: "1"
          ZHUYE_DIFF_BASELINE: ${{ github.workspace }}/target/release/zhuye
          ZHUYE_DIFF_CANDIDATE: ${{ github.workspace }}/target/debug/zhuye
          ZHUYE_DIFF_OUTPUT: ${{ github.workspace }}/target/verification/builds
        run: python3 tests/runner.py run --task agent.contract.differential
      - name: Download latest published runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p target/previous-release
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*x86_64-unknown-linux-gnu.tar.gz' --dir target/previous-release
          tar -xzf target/previous-release/*.tar.gz -C target/previous-release
          binary=$(find target/previous-release -type f -name zhuye -print -quit)
          test -n "$binary"
          cp "$binary" target/previous-release/zhuye-baseline
          chmod +x target/previous-release/zhuye-baseline
          printf '%s\n' "$tag" > target/previous-release/tag.txt
      # 挂账(配置 v2 时代):发布版本差分与 v0.1.15 基线存在**有意**行为
      # 分歧 —— 「assistant 内容按步骤增量落盘」改变了 message 记录顺序,
      # 提示词选择新增 prompt_selection_changed 记录;rollout 序列严格
      # 比对按设计不设豁免通道(differential.py),跨有意变更期必然红
      # (2026-11-19 起挂账)。语义差分(同提交 release vs debug,builds
      # 报告)不受影响,恒严格判定。
      # 恢复条件:切 v0.1.16 发布重置基线后,移除本 step 的
      # continue-on-error,并在「Check differential reports」恢复
      # published 报告的严格断言(该 step 内有对应注释位)。
      - name: Run published version differential
        continue-on-error: true
        env:
          ZHUYE_DIFF: "1"
          ZHUYE_DIFF_BASELINE: ${{ github.workspace }}/target/previous-release/zhuye-baseline
          ZHUYE_DIFF_CANDIDATE: ${{ github.workspace }}/target/debug/zhuye
          ZHUYE_DIFF_OUTPUT: ${{ github.workspace }}/target/verification/published
        run: python3 tests/runner.py run --task agent.contract.differential
      - name: Check differential reports
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = {json.loads(path.read_text())['id'] for path in Path('tests/verification/cases').glob('*.json')}
          assert expected
          # 语义差分(同提交 release vs debug)恒严格:verdict 必须 pass、
          # 用例覆盖完整、逐用例 pass。
          builds = json.loads(Path('target/verification/builds/report.json').read_text())
          assert builds['verdict'] == 'pass', 'builds verdict'
          assert {result['id'] for result in builds['results']} == expected, 'builds coverage'
          assert all(result['verdict'] == 'pass' for result in builds['results']), 'builds results'
          # 发布版本差分:跨有意行为变更期(配置 v2 等)基线重放序列按设计
          # 必然分歧,此处置为「只记录不判红」。切 v0.1.16 发布重置基线后,
          # 恢复严格断言并与上方 Run step 的 continue-on-error 一并移除:
          #   assert published['verdict'] == 'pass', 'published verdict'
          #   assert {r['id'] for r in published['results']} == expected
          #   assert all(r['verdict'] == 'pass' for r in published['results'])
          published = json.loads(Path('target/verification/published/report.json').read_text())
          if published['verdict'] != 'pass':
              print(f"[warn] published differential verdict={published['verdict']}"
                    "(挂账:v0.1.16 发布重置基线前预期分歧,仅记录不判红)")
          PY
      - name: Upload semantic differential evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semantic-differential
          path: |
            target/verification/
            target/previous-release/tag.txt
          if-no-files-found: ignore
